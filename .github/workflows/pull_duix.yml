name: Pull DUIX image and push to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Docker image (default: guiji2025/duix.avatar:latest)"
        required: false
        default: "guiji2025/duix.avatar:latest"
        type: string

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull source image
        run: |
          echo "Pulling ${{ inputs.image_name }}"
          docker pull "${{ inputs.image_name }}"
          docker images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}" | head -20

      - name: Retag and push to ACR
        run: |
          SRC="${{ inputs.image_name }}"
          # 转小写, 去特殊字符作为 ACR tag
          SAFE_TAG=$(echo "$SRC" | tr '[:upper:]' '[:lower:]' | sed 's|[/:.]|_|g')
          TARGET="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${SAFE_TAG}"
          echo "Retag: $SRC -> $TARGET"
          docker tag "$SRC" "$TARGET"
          docker push "$TARGET"
          echo ""
          echo "✅ Push done: $TARGET"

      - name: Print summary
        run: |
          echo "## DUIX 镜像推送完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 源: \`${{ inputs.image_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 目标: \`${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/<自动tag>\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本机拉取" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull \${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/guiji2025_duix_avatar_latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 8080:8080 \${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/guiji2025_duix_avatar_latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY