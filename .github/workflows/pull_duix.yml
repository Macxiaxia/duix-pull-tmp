name: Pull DUIX and push to ACR

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR via RAM (the only way)
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          AK_ID: ${{ secrets.ACR_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.ACR_ACCESS_KEY_SECRET }}
        run: |
          set -e
          echo "Get ACR temp token via RAM AK/SK..."
          TOKEN_JSON=$(curl -sS -u "${AK_ID}:${AK_SECRET}" \
            "https://${REGISTRY}/v2/token?service=${REGISTRY}&scope=repository:push,pull" \
            --max-time 30)
          echo "Token resp: ${TOKEN_JSON:0:200}"
          TOKEN=$(echo "$TOKEN_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['token'] or json.load(sys.stdin)['access_token'])")
          USER=$(echo "$TOKEN_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('username') or d.get('user') or '')")
          [ -z "$USER" ] && USER="token"
          echo "Username=$USER token_len=${#TOKEN}"
          echo "$TOKEN" | docker login "$REGISTRY" -u "$USER" --password-stdin

      - name: Pull source image
        run: |
            SRC="${{ inputs.image_name }}"
            if [ -z "$SRC" ]; then SRC="guiji2025/duix.avatar:latest"; fi
            echo "Pulling $SRC ..."
            docker pull "$SRC"

      - name: Retag and push to ACR
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          SRC="${{ inputs.image_name }}"
          if [ -z "$SRC" ]; then SRC="guiji2025/duix.avatar:latest"; fi
          SAFE_TAG=$(echo "$SRC" | tr '[:upper:]' '[:lower:]' | sed 's|[/:.]|_|g')
          TARGET="${REGISTRY}/${NAMESPACE}/${SAFE_TAG}"
          echo "Tag: $SRC -> $TARGET"
          docker tag "$SRC" "$TARGET"
          docker push "$TARGET"
          echo "✅ Pushed to $TARGET"