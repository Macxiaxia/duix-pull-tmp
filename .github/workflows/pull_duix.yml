name: Pull DUIX and push to ACR

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR (official action v2 - ACR compatible)
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_ALIYUN_USER }}
          password: ${{ secrets.ACR_ALIYUN_PASSWORD }}
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_ALIYUN_USER }}
          password: ${{ secrets.ACR_ALIYUN_PASSWORD }}

      - name: Pull source image
        run: |
          SRC="${{ inputs.image_name }}"
          if [ -z "$SRC" ]; then SRC="guiji2025/duix.avatar:latest"; fi
          docker pull "$SRC"

      - name: Retag and push to ACR
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          SRC="${{ inputs.image_name }}"
          if [ -z "$SRC" ]; then SRC="guiji2025/duix.avatar:latest"; fi
          SAFE_TAG=$(echo "$SRC" | tr '[:upper:]' '[:lower:]' | sed 's|[/:.]|_|g')
          TARGET="${REGISTRY}/${NAMESPACE}/${SAFE_TAG}"
          docker tag "$SRC" "$TARGET"
          docker push "$TARGET"
          echo "Pushed to $TARGET"