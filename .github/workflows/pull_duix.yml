name: Pull DUIX and push to ACR

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get ACR Bearer token (explicit flow)
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          USERNAME: ${{ secrets.ACR_ALIYUN_USER }}
          PASSWORD: ${{ secrets.ACR_ALIYUN_PASSWORD }}
        run: |
          set -e
          AUTH_HOST="dockerauth.cn-hangzhou.aliyuncs.com"
          SERVICE="registry.aliyuncs.com:cn-hangzhou:26842"
          echo "Fetching Bearer token..."
          TOKEN_RESP=$(curl -sS -u "${USERNAME}:${PASSWORD}" \
            "https://${AUTH_HOST}/auth?service=${SERVICE}&scope=repository:nuomi1122:pull,push" \
            --max-time 30)
          echo "Token resp: ${TOKEN_RESP:0:200}"
          TOKEN=$(echo "$TOKEN_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "Token len=${#TOKEN}"
          echo "$TOKEN" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin

      - name: Pull source image
        run: |
          SRC="${{ inputs.image_name }}"
          if [ -z "$SRC" ]; then SRC="guiji2025/duix.avatar:latest"; fi
          docker pull "$SRC"

      - name: Retag and push to ACR
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          SRC="${{ inputs.image_name }}"
          if [ -z "$SRC" ]; then SRC="guiji2025/duix.avatar:latest"; fi
          SAFE_TAG=$(echo "$SRC" | tr '[:upper:]' '[:lower:]' | sed 's|[/:.]|_|g')
          TARGET="${REGISTRY}/${NAMESPACE}/${SAFE_TAG}"
          docker tag "$SRC" "$TARGET"
          docker push "$TARGET"
          echo "Pushed to $TARGET"