name: Pull DUIX and push to ACR

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR (RAM sub-user full name)
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          AK_ID: ${{ secrets.ACR_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.ACR_ACCESS_KEY_SECRET }}
        run: |
          set -e
          USER="openclaw@1185145838442782.onaliyun.com"
          echo "Login user: $USER  registry: $REGISTRY  pw_len=${#AK_SECRET}"
          echo "$AK_SECRET" | docker login "$REGISTRY" -u "$USER" --password-stdin