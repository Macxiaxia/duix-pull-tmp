name: Pull DUIX and push to ACR

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test ACR with verbose WWW-Authenticate
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          echo "[1] /v2/ no auth (see what auth method server wants)"
          curl -sS -i "https://${REGISTRY}/v2/" --max-time 15 2>&1 | head -15
          echo ""
          echo "[2] Basic auth nick7158876044 / nuomi@1224"
          curl -sS -i -u "nick7158876044:nuomi@1224" "https://${REGISTRY}/v2/" --max-time 15 2>&1 | head -15
          echo ""
          echo "[3] Basic auth nuomi@1224 / nuomi@1224"
          curl -sS -i -u "nuomi@1224:nuomi@1224" "https://${REGISTRY}/v2/" --max-time 15 2>&1 | head -15
          echo ""
          echo "[4] Basic auth nuomi / nuomi@1224"
          curl -sS -i -u "nuomi:nuomi@1224" "https://${REGISTRY}/v2/" --max-time 15 2>&1 | head -15

      - name: Docker login (most likely combo)
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          echo "--- nick7158876044 ---"
          echo "nuomi@1224" | docker login "$REGISTRY" -u "nick7158876044" --password-stdin
          echo "--- nuomi@1224 ---"
          echo "nuomi@1224" | docker login "$REGISTRY" -u "nuomi@1224" --password-stdin