name: Pull DUIX and push to ACR

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR (try 5 users, succeed on first OK)
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          FIXED_PW: ${{ secrets.ACR_FIXED_PASSWORD }}
        run: |
          set -e
          echo "Registry=$REGISTRY namespace=$NAMESPACE"
          SUCCESS=0
          for user in "1185145838442782" "1185145838442782@nuomi1122" "nuomi1122" "nick7158876044" "1185145838442782@${NAMESPACE}"; do
            echo ""
            echo "=== try user=[$user] ==="
            if echo "$FIXED_PW" | docker login "$REGISTRY" -u "$user" --password-stdin 2>&1 | tee /tmp/login.out; then
              if grep -qi "login succeeded" /tmp/login.out; then
                echo ">>> LOGIN SUCCESS user=$user"
                SUCCESS=1
                break
              fi
            fi
          done
          if [ "$SUCCESS" != "1" ]; then
            echo ""
            echo "!!! All 5 users failed with FIXED PASSWORD"
            echo "!!! Trying with ACCESS KEY SECRET instead..."
            SUCCESS=0
            for user in "openclaw@1185145838442782.onaliyun.com" "1185145838442782@${NAMESPACE}"; do
              echo ""
              echo "=== try AK user=[$user] ==="
              if echo "${{ secrets.ACR_ACCESS_KEY_SECRET }}" | docker login "$REGISTRY" -u "$user" --password-stdin 2>&1 | tee /tmp/login.out; then
                if grep -qi "login succeeded" /tmp/login.out; then
                  echo ">>> LOGIN SUCCESS user=$user (AK)"
                  SUCCESS=1
                  break
                fi
              fi
            done
          fi
          [ "$SUCCESS" = "1" ] || (echo "ALL FAILED"; exit 1)

      - name: Pull source image
        run: |
          SRC="${{ inputs.image_name }}"
          if [ -z "$SRC" ]; then SRC="guiji2025/duix.avatar:latest"; fi
          docker pull "$SRC"

      - name: Retag and push to ACR
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          SRC="${{ inputs.image_name }}"
          if [ -z "$SRC" ]; then SRC="guiji2025/duix.avatar:latest"; fi
          SAFE_TAG=$(echo "$SRC" | tr '[:upper:]' '[:lower:]' | sed 's|[/:.]|_|g')
          TARGET="${REGISTRY}/${NAMESPACE}/${SAFE_TAG}"
          docker tag "$SRC" "$TARGET"
          docker push "$TARGET"
          echo "Pushed to $TARGET"