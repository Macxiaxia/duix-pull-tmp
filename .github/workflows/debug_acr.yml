name: Debug ACR login

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test 5 ACR login approaches
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          USERNAME: ${{ secrets.ACR_USERNAME }}
          PASSWORD: ${{ secrets.ACR_PASSWORD }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          echo "REGISTRY=$REGISTRY"
          echo "NAMESPACE=$NAMESPACE"
          echo "USERNAME=$USERNAME"
          echo "PASSWORD length=${#PASSWORD}"
          echo ""
          echo "[A] docker login basic"
          echo "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin 2>&1 || true
          echo ""
          echo "[B] docker login with crpi-public vpc endpoint"
          echo "$PASSWORD" | docker login "crpi-24jpncn6bhgr7pzy.cn-hangzhou.personal.cr.aliyuncs.com" -u "$USERNAME" --password-stdin 2>&1 || true
          echo ""
          echo "[C] docker login with full RAM name"
          echo "$PASSWORD" | docker login "$REGISTRY" -u "openclaw@1185145838442782.onaliyun.com" --password-stdin 2>&1 || true
          echo ""
          echo "[D] curl /v2/ basic with 4 username variants"
          for u in "$USERNAME" "openclaw@1185145838442782.onaliyun.com" "$NAMESPACE" "1185145838442782"; do
            echo "  user=$u"
            curl -sS -u "$u:$PASSWORD" "https://$REGISTRY/v2/" -w "  HTTP=%{http_code}\n" 2>&1 | head -2
          done
          echo ""
          echo "[E] aliyun cr GetAuthorizationToken API (official way)"
          curl -sS -X POST "https://$REGISTRY/v2/" -H "Content-Type: application/json" -w "HTTP=%{http_code}\n" 2>&1 | head -5
          echo ""
          echo "[F] STS GetCallerIdentity (verify AK valid)"
          curl -sS "https://sts.aliyuncs.com/?Action=GetCallerIdentity&AccessKeyId=$USERNAME&Format=JSON&SignatureMethod=HMAC-SHA1&SignatureNonce=test&SignatureVersion=1.0&TimeStamp=2026-09-03T00:00:00Z&Version=2015-04-01" -w "HTTP=%{http_code}\n" 2>&1 | head -5