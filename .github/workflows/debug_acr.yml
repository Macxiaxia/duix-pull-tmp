name: Debug ACR login

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test all ACR login methods
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          USERNAME: ${{ secrets.ACR_USERNAME }}
          PASSWORD: ${{ secrets.ACR_PASSWORD }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          echo "REGISTRY=$REGISTRY"
          echo "NAMESPACE=$NAMESPACE"
          echo "USERNAME=$USERNAME"
          echo "PASSWORD length=${#PASSWORD}"
          echo ""
          echo "[1] docker login current"
          echo "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin 2>&1 || true
          echo ""
          echo "[2] curl /v2/ -W status code"
          curl -sS -u "$USERNAME:$PASSWORD" "https://$REGISTRY/v2/" -w "HTTP=%{http_code}\n" 2>&1 | head -5
          echo ""
          echo "[3] try registry=crpi-public domain"
          curl -sS -u "$USERNAME:$PASSWORD" "https://crpi-24jpncn6bhgr7pzy.cn-hangzhou.personal.cr.aliyuncs.com/v2/" -w "HTTP=%{http_code}\n" 2>&1 | head -5
          echo ""
          echo "[4] try username=full RAM login name"
          curl -sS -u "openclaw@1185145838442782.onaliyun.com:$PASSWORD" "https://$REGISTRY/v2/" -w "HTTP=%{http_code}\n" 2>&1 | head -5
          echo ""
          echo "[5] try registry with namespace subdomain"
          curl -sS -u "$USERNAME:$PASSWORD" "https://$NAMESPACE.$REGISTRY/v2/" -w "HTTP=%{http_code}\n" 2>&1 | head -5
          echo ""
          echo "[6] docker info (network check)"
          docker info 2>&1 | grep -iE "registry|server" | head -3