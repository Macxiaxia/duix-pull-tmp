name: Debug ACR login

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test docker login
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          USERNAME: ${{ secrets.ACR_USERNAME }}
          PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "REGISTRY=$REGISTRY"
          echo "USERNAME=$USERNAME"
          echo "PASSWORD length=${#PASSWORD}"
          echo ""
          echo "[1] docker login"
          echo "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin 2>&1 || echo "LOGIN FAILED"
          echo ""
          echo "[2] curl /v2/ with basic auth"
          curl -sS -u "$USERNAME:$PASSWORD" "https://$REGISTRY/v2/" -w "\nHTTP=%{http_code}\n" 2>&1
          echo ""
          echo "[3] curl /v2/_catalog with basic auth"
          curl -sS -u "$USERNAME:$PASSWORD" "https://$REGISTRY/v2/_catalog" -w "\nHTTP=%{http_code}\n" 2>&1
          echo ""
          echo "[4] try different username=account-id"
          curl -sS -u "1185145838442782:$PASSWORD" "https://$REGISTRY/v2/" -w "\nHTTP=%{http_code}\n" 2>&1
          echo ""
          echo "[5] try username=namespace"
          curl -sS -u "nuomi1122:$PASSWORD" "https://registry.cn-hangzhou.aliyuncs.com/v2/" -w "\nHTTP=%{http_code}\n" 2>&1
